[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeagent"
version = "0.1.0"
description = "Phase 1: Local Autonomous AI Coding Assistant CLI powered by Ollama and Qwen3"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "CodeAgent Team" }
]
keywords = ["ai", "cli", "coding-assistant", "ollama", "qwen3", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "ollama>=0.3.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
codeag = "codeagent.main:main"
"code-ag" = "codeagent.main:main"
codeagent = "codeagent.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["codeagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
markers = [
    "integration: marks tests as live integration tests against local Ollama",
]
addopts = "-m 'not integration'"
